# =============================================================================
# Property Geocoder Microservice - Production Docker Compose
# =============================================================================
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Create .env file with production values (see .env.example)
#   2. Run database migrations before first start
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API Service - Property Geocoder
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geocoder-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-geocoder}
      DB_USER: ${DB_USER:-geocoder}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MIN_DB_CONNECTIONS: ${MIN_DB_CONNECTIONS:-5}
      MAX_DB_CONNECTIONS: ${MAX_DB_CONNECTIONS:-20}
      # Redis (password kept out of the URL; cache.py picks up REDIS_PASSWORD)
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      NEGATIVE_CACHE_TTL_SECONDS: ${NEGATIVE_CACHE_TTL_SECONDS:-3600}
      # Authentication
      API_KEY_REQUIRED: ${API_KEY_REQUIRED:-true}
      API_KEY_HEADER: ${API_KEY_HEADER:-X-API-Key}
      API_KEY_CACHE_TTL: ${API_KEY_CACHE_TTL:-300}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      INITIAL_ADMIN_KEY: ${INITIAL_ADMIN_KEY:-}
      INITIAL_ADMIN_KEY_NAME: ${INITIAL_ADMIN_KEY_NAME:-Bootstrap Admin}
      INITIAL_ADMIN_KEY_OWNER: ${INITIAL_ADMIN_KEY_OWNER:-system}
      API_KEY_PREFIX: ${API_KEY_PREFIX:-gc_}
      # Rate Limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      # IP Filtering
      IP_FILTER_ENABLED: ${IP_FILTER_ENABLED:-true}
      # Trusted reverse proxies (comma-separated IPs/CIDRs); empty = trust no
      # X-Forwarded-For / X-Real-IP headers
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Security
      SECURE_HEADERS_ENABLED: ${SECURE_HEADERS_ENABLED:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required - set explicit allowed origins, not *}
      # Application
      ENV: production
      PORT: 3000
      BATCH_CONCURRENCY_LIMIT: ${BATCH_CONCURRENCY_LIMIT:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - geocoder-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # PostgreSQL with PostGIS
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:15-3.3
    container_name: geocoder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-geocoder}
      POSTGRES_USER: ${DB_USER:-geocoder}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/migrations.sql:/docker-entrypoint-initdb.d/02-migrations.sql
      - ./database/seed_data_sources.sql:/docker-entrypoint-initdb.d/03-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-geocoder} -d ${DB_NAME:-geocoder}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    networks:
      - geocoder-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: geocoder-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required}" --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      # $$ escapes compose interpolation; REDISCLI_AUTH avoids the password
      # showing up in `ps` output inside the container
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - geocoder-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # ETL - Data sourcing jobs (downloaders, importers, transformers)
  # ---------------------------------------------------------------------------
  # Not started by `docker compose up`. Run explicitly:
  #   docker compose run --rm etl data_sourcing.setup_data --all-confirmed
  #   docker compose run --rm etl data_sourcing.importers.import_production_data
  # ---------------------------------------------------------------------------
  etl:
    build:
      context: .
      dockerfile: Dockerfile.etl
    container_name: geocoder-etl
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-geocoder}
      DB_USER: ${DB_USER:-geocoder}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./data_sourcing/data_sources:/app/data_sourcing/data_sources
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - geocoder-network
    profiles:
      - etl
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

# =============================================================================
# Networks
# =============================================================================
networks:
  geocoder-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
