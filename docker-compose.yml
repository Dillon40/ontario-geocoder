# =============================================================================
# Property Geocoder - Docker Compose
# =============================================================================
#
# Starts the API service. PostgreSQL and Redis run on the host.
#
# Usage:
#   docker compose up -d            # start API
#   docker compose logs -f api      # tail logs
#   docker compose down             # stop
#
# The API uses host networking to connect to host-level Postgres (5432)
# and Redis (6379). This avoids Docker port-mapping issues in LXC/VPS.
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geocoder-api
    restart: unless-stopped
    network_mode: host
    environment:
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-geocoder}
      DB_USER: ${DB_USER:-geocoder}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - set it in .env}
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Secure by default; opt out explicitly in .env for local development
      API_KEY_REQUIRED: ${API_KEY_REQUIRED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      IP_FILTER_ENABLED: ${IP_FILTER_ENABLED:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      ENV: ${ENV:-development}
      PORT: ${API_PORT:-3001}
      BATCH_CONCURRENCY_LIMIT: ${BATCH_CONCURRENCY_LIMIT:-10}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${API_PORT:-3001}/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # ETL - Data sourcing jobs (downloaders, importers, transformers)
  # ---------------------------------------------------------------------------
  # Not started by `docker compose up`. Run explicitly:
  #   docker compose run --rm etl data_sourcing.setup_data --all-confirmed
  #   docker compose run --rm etl data_sourcing.importers.import_production_data
  # ---------------------------------------------------------------------------
  etl:
    build:
      context: .
      dockerfile: Dockerfile.etl
    container_name: geocoder-etl
    network_mode: host
    environment:
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-geocoder}
      DB_USER: ${DB_USER:-geocoder}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - set it in .env}
    volumes:
      - ./data_sourcing/data_sources:/app/data_sourcing/data_sources
    profiles:
      - etl
