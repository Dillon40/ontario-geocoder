[project]
name = "ontario-geocoder"
version = "1.0.0"
description = "Tiered cascading geocoding system for Ontario property addresses"
license = "MIT"
authors = [{ name = "Dillon Fraser" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.10",
    "redis==5.2.0",
    "pydantic==2.10.0",
    "pydantic-settings==2.6.0",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "geopandas>=1.0.0",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.14.0",
    "ijson>=3.2.0",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "engine", "data_sourcing"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
